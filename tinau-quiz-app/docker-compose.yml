version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: tinau-quiz-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tinau-quiz-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/tinau_quiz}
      JWT_SECRET: ${JWT_SECRET:-tinau_quiz_secret_key_2056}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ADMIN@tinau.com}
      ADMIN_PASS: ${ADMIN_PASS:-tebs@2056}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tinau-quiz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  backend_uploads:
